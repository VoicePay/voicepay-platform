name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install black==23.9.1 flake8

      - run: black --check .
      - run: flake8 .

  yaml-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: pip install yamllint
      - run: yamllint -c .yamllint .

  test:
    runs-on: ubuntu-latest
    needs: [lint]

    defaults:
      run:
        working-directory: services/auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt pytest pytest-django
      - run: pytest -v

  docker-push:
    runs-on: ubuntu-latest
    needs: [lint, test, yaml-lint]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        run: |
          IMAGE_URI=${{ secrets.ECR_REGISTRY }}/voicepay-auth
          docker build -t $IMAGE_URI:${{ github.sha }} -t $IMAGE_URI:latest ./services/auth
          docker push $IMAGE_URI:${{ github.sha }}
          docker push $IMAGE_URI:latest
