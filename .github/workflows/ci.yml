name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install black==23.9.1 flake8

      - run: black --check .
      - run: flake8 .

  yaml-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: pip install yamllint
      - run: yamllint -c .yamllint .

  test:
    runs-on: ubuntu-latest
    needs: [lint]

    defaults:
      run:
        working-directory: services/auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt pytest pytest-django
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test, yaml-lint]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t voicepay-auth:${{ github.sha }} ./services/auth
