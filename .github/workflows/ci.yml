name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI passed
        run: echo "Pipeline ran successfully"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install black flake8

      - name: Run black
        run: black --check .

      - name: Run flake8
        run: flake8 .
