name: Terraform

on:
  pull_request:
    branches: [dev, staging, prod]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform*.yml"
  push:
    branches: [dev, staging, prod]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform*.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply (dev, staging, prod)"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  terraform:
    name: Plan - ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            working_directory: infra/terraform/envs/dev
            auto_apply: true
          - environment: staging
            working_directory: infra/terraform/envs/staging
            auto_apply: true
          - environment: prod
            working_directory: infra/terraform/envs/prod
            auto_apply: false
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      environment: ${{ matrix.environment }}
      working_directory: ${{ matrix.working_directory }}
      apply: >-
        ${{ (github.event_name == 'push' && matrix.auto_apply == true) ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == matrix.environment) }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      GITHUB_OIDC_PROVIDER_ARN: ${{ secrets.GITHUB_OIDC_PROVIDER_ARN }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
