name: Terraform Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy (dev, staging, prod)"
        required: true
        type: string
      working_directory:
        description: "Terraform working directory"
        required: true
        type: string
      apply:
        description: "Whether to run terraform apply"
        required: false
        type: boolean
        default: false
      destroy:
        description: "Whether to run terraform destroy"
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_DEFAULT_REGION:
        required: true
      TF_GITHUB_OIDC_PROVIDER_ARN:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      EKS_PUBLIC_CIDRS:
        required: false

jobs:
  terraform:
    name: Terraform ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      pull-requests: write
      actions: write


    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Ensure Bootstrap Resources Exist
        run: |
          aws s3api head-bucket --bucket voicepay-terraform-state-${{ secrets.AWS_ACCOUNT_ID }} 2>/dev/null || \
          aws s3api create-bucket --bucket voicepay-terraform-state-${{ secrets.AWS_ACCOUNT_ID }} --region us-east-1
          aws dynamodb describe-table --table-name voicepay-terraform-locks 2>/dev/null || \
          aws dynamodb create-table \
            --table-name voicepay-terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Run tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint --recursive

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ inputs.working_directory }}
          soft_fail: false

      - name: Prepare public access CIDRs
        run: |
          if [ -z "${EKS_PUBLIC_CIDRS:-}" ]; then
            echo "Warning: EKS_PUBLIC_CIDRS not set, using empty list"
            echo "PUBLIC_ACCESS_CIDRS=[]" >> $GITHUB_ENV
          else
            if echo "${EKS_PUBLIC_CIDRS}" | grep -Eq '^\[.*\]$'; then
              echo "PUBLIC_ACCESS_CIDRS=${EKS_PUBLIC_CIDRS}" >> $GITHUB_ENV
            else
              echo "PUBLIC_ACCESS_CIDRS=[\"${EKS_PUBLIC_CIDRS}\"]" >> $GITHUB_ENV
            fi
          fi

      - name: Terraform Plan
        if: inputs.destroy == false
        id: plan
        run: |
          terraform plan \
            -var="github_oidc_provider_arn=${{ secrets.TF_GITHUB_OIDC_PROVIDER_ARN }}" \
            -var='public_access_cidrs='"$PUBLIC_ACCESS_CIDRS" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Post Plan to PR
        if: github.event_name == 'pull_request' && inputs.destroy == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join(
              process.env.GITHUB_WORKSPACE,
              '${{ inputs.working_directory }}',
              'plan_output.txt'
            );
            const plan = fs.readFileSync(planPath, 'utf8');
            const lines = plan.split('\n');
            const summary = lines.slice(-5).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `## Terraform Plan - \`${{ inputs.environment }}\``,
                '\`\`\`',
                summary,
                '\`\`\`',
                '> Full plan available as artifact'
              ].join('\n')
            });

      - name: Upload Plan Artifact
        if: inputs.destroy == false
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}/plan_output.txt
          retention-days: 7

      - name: Terraform Apply
        if: inputs.apply == true && inputs.destroy == false
        run: |
          terraform apply -auto-approve tfplan

      - name: Trigger CI to push Docker image
        if: inputs.apply == true && inputs.destroy == false
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: 'dev'
            });
            console.log('CI workflow triggered to push Docker image to ECR');

      - name: Terraform Destroy
        if: inputs.destroy == true
        run: |
          terraform destroy \
            -var="github_oidc_provider_arn=${{ secrets.TF_GITHUB_OIDC_PROVIDER_ARN }}" \
            -auto-approve
