name: Terraform Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy (dev, staging, prod)"
        required: true
        type: string
      working_directory:
        description: "Terraform working directory"
        required: true
        type: string
      apply:
        description: "Whether to run terraform apply"
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_DEFAULT_REGION:
        required: true
      GITHUB_OIDC_PROVIDER_ARN:
        required: true
      AWS_ACCOUNT_ID:
        required: true

jobs:
  terraform:
    name: Terraform ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Ensure Bootstrap Resources Exist
        run: |
          aws s3api head-bucket --bucket voicepay-terraform-state-${{ secrets.AWS_ACCOUNT_ID }} 2>/dev/null || \
          aws s3api create-bucket --bucket voicepay-terraform-state-${{ secrets.AWS_ACCOUNT_ID }} --region us-east-1
          aws dynamodb describe-table --table-name voicepay-terraform-locks 2>/dev/null || \
          aws dynamodb create-table \
            --table-name voicepay-terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="github_oidc_provider_arn=${{ secrets.GITHUB_OIDC_PROVIDER_ARN }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.working_directory }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... truncated' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan - \`${{ inputs.environment }}\`\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Terraform Apply
        if: inputs.apply == true
        run: |
          terraform apply \
            -var="github_oidc_provider_arn=${{ secrets.GITHUB_OIDC_PROVIDER_ARN }}" \
            -auto-approve tfplan
