apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicepay-auth-green
  namespace: default
  labels:
    app: voicepay-auth
    slot: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: voicepay-auth
      slot: green
  template:
    metadata:
      labels:
        app: voicepay-auth
        slot: green
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "voicepay-auth"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/voicepay-auth"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/voicepay-auth" -}}
          {{ .Data.data | toJSONPretty }}
          {{- end -}}
    spec:
      serviceAccountName: voicepay-auth
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: voicepay-auth
                    slot: green
                topologyKey: kubernetes.io/hostname
      containers:
        - name: voicepay-auth
          image: 147177189510.dkr.ecr.us-east-1.amazonaws.com/voicepay-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "voicepay.settings"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: DEBUG
              value: "false"
            - name: APP_SLOT
              value: "green"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
