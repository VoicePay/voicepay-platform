apiVersion: v1
kind: ServiceAccount
metadata:
  name: voicepay-auth
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicepay-auth
  namespace: default
  labels:
    app: voicepay-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voicepay-auth
  template:
    metadata:
      labels:
        app: voicepay-auth
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "voicepay-auth"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/voicepay-auth"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/voicepay-auth" -}}
          {{ .Data.data | toJSONPretty }}
          {{- end -}}
    spec:
      serviceAccountName: voicepay-auth
      containers:
        - name: voicepay-auth
          image: voicepay-auth:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "voicepay.settings"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: DEBUG
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
