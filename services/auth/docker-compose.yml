services:
  web:
    container_name: voicepay-auth
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    container_name: voicepay-auth-db
    image: postgres:16
    environment:
      POSTGRES_DB: voicepayDB
      POSTGRES_USER: voicepay
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
