services:
  web:
    container_name: voicepay-auth
    build: .
    command: sh -c "python manage.py migrate && newrelic-admin run-program python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=voicepay-auth
      - NEW_RELIC_HOST=collector.newrelic.com
      - NEW_RELIC_LOG=stdout
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=true
    depends_on:
      - db

  db:
    container_name: voicepay-auth-db
    image: postgres:16
    environment:
      POSTGRES_DB: voicepayDB
      POSTGRES_USER: voicepay
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    container_name: voicepay-prometheus
    image: prom/prometheus:v2.51.0
    volumes:
      - ../../infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../../infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"

  grafana:
    container_name: voicepay-grafana
    image: grafana/grafana:10.4.0
    volumes:
      - ../../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../../infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
